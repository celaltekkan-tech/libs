server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy (HTTPS) arkasında Location başlığı http://... olmasın; göreli yönlendir.
    absolute_redirect off;

    # Olmayan adres gerçek 404 döner; anasayfaya düşmek Google'da "soft 404" sayılır.
    error_page 404 /404.html;

    # .html'li istekleri tek kanonik (uzantısız) adrese yönlendir.
    # $request_uri istemcinin özgün isteğidir; iç yönlendirmeleri etkilemez.
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /;
    }
    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1;
    }

    location = /index { return 301 /; }
    location = /404.html { internal; }

    # Sondaki eğik çizgiyi at: /moduller/ -> /moduller
    location ~ ^(/.+)/$ { return 301 $1; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Uzantısız temiz URL'ler: /moduller/disiplin -> /moduller/disiplin.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
}
