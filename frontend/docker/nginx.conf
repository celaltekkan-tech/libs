server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Panel dizine eklenmesin (HTML dışı yanıtlar dahil). robots.txt taramayı engellemez;
    # engellerse Google noindex başlığını göremez ve eski kayıt indekste kalır.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Backend ile aynı origin üzerinden erişim (CORS'a gerek kalmaz).
    # "backend" adı docker-compose'daki servis adıdır.
    # Yedek dosyası yükleme/indirme diğer API çağrılarından büyük ve uzun sürebilir.
    location /api/backups/ {
        client_max_body_size 512m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
