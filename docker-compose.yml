services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: production
      BACKUP_DIR: /app/backups
    volumes:
      - ./uploads:/app/uploads
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups
    depends_on:
      db:
        condition: service_healthy
      solver:
        condition: service_started
    networks:
      - internal
      - proxy

  # OR-Tools ders programı çözücüsü; yalnızca iç ağdan (backend) erişilir.
  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SOLVER_MAX_JOBS: ${SOLVER_MAX_JOBS:-1}
      SOLVER_WORKERS: ${SOLVER_WORKERS:-4}
    deploy:
      resources:
        limits:
          memory: ${SOLVER_MEMORY_LIMIT:-2g}
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - proxy

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - proxy

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Metro manifest'teki bundle/asset URL'lerini NPM'in public adresine göre
      # üretir; yoksa "https://<host>:8081/..." yazar ve telefon 8081'e erişemez.
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-https://mobile.oids.com.tr}
    networks:
      - proxy

networks:
  internal:
    driver: bridge
  # Nginx Proxy Manager'ın kullandığı Docker network. Gerçek adı için:
  # docker network ls | grep -i proxy   (veya npm compose dosyasındaki network adı)
  proxy:
    external: true
    name: ${NPM_NETWORK_NAME:-nginx-proxy-manager_default}
