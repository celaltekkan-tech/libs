services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: production
      BACKUP_DIR: /app/backups
      # .env içindeki 127.0.0.1 değerini ezer; API çözücüye iç ağdan gider.
      SOLVER_URL: http://solver:8000
      SMTP_HOST: mail
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_TLS_REJECT: "false"
      SMTP_USER: ${MAIL_ACCOUNT:-info@oids.com.tr}
      SMTP_PASS: ${MAIL_ACCOUNT_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-OIDS <info@oids.com.tr>}
      MAIL_ACCOUNT: ${MAIL_ACCOUNT:-info@oids.com.tr}
      MAIL_ACCOUNT_PASSWORD: ${MAIL_ACCOUNT_PASSWORD:-}
      IMAP_HOST: mail
      IMAP_PORT: 143
      IMAP_SECURE: "false"
    volumes:
      - ./uploads:/app/uploads
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups
    depends_on:
      db:
        condition: service_healthy
      solver:
        condition: service_healthy
    networks:
      - internal
      - proxy

  # OR-Tools ders programı çözücüsü; yalnızca iç ağdan (backend) erişilir.
  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SOLVER_MAX_JOBS: ${SOLVER_MAX_JOBS:-1}
      SOLVER_WORKERS: ${SOLVER_WORKERS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${SOLVER_MEMORY_LIMIT:-2g}
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - proxy

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - proxy

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Metro manifest'teki bundle/asset URL'lerini NPM'in public adresine göre
      # üretir; yoksa "https://<host>:8081/..." yazar ve telefon 8081'e erişemez.
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-https://mobile.oids.com.tr}
    networks:
      - proxy

  # info@oids.com.tr — SMTP/IMAP. Arayüz ayrı webmail değil, panel /platform/mailbox.
  mail-init:
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1
    restart: "no"
    env_file:
      - .env
    environment:
      MAIL_ACCOUNT: ${MAIL_ACCOUNT:-info@oids.com.tr}
      MAIL_ACCOUNT_PASSWORD: ${MAIL_ACCOUNT_PASSWORD:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-oids.com.tr}
    volumes:
      - ./data/mail/config:/tmp/docker-mailserver
      - ./docker/mail-bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    networks:
      - internal

  mail:
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1
    hostname: ${MAIL_HOSTNAME:-mail.oids.com.tr}
    restart: unless-stopped
    stop_grace_period: 1m
    depends_on:
      mail-init:
        condition: service_completed_successfully
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    environment:
      TZ: Europe/Istanbul
      OVERRIDE_HOSTNAME: ${MAIL_HOSTNAME:-mail.oids.com.tr}
      POSTMASTER_ADDRESS: ${MAIL_ACCOUNT:-info@oids.com.tr}
      ENABLE_IMAP: 1
      ENABLE_POP3: 0
      ENABLE_CLAMAV: 0
      ENABLE_FAIL2BAN: 0
      PERMIT_DOCKER: none
      SSL_TYPE: ${MAIL_SSL_TYPE:-}
    volumes:
      - ./data/mail/data:/var/mail
      - ./data/mail/state:/var/mail-state
      - ./data/mail/logs:/var/log/mail
      - ./data/mail/config:/tmp/docker-mailserver
    networks:
      - internal

networks:
  internal:
    driver: bridge
  # Nginx Proxy Manager'ın kullandığı Docker network. Gerçek adı için:
  # docker network ls | grep -i proxy   (veya npm compose dosyasındaki network adı)
  proxy:
    external: true
    name: ${NPM_NETWORK_NAME:-nginx-proxy-manager_default}
