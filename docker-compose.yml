services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: production
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - proxy

networks:
  internal:
    driver: bridge
  # Nginx Proxy Manager'ın kullandığı Docker network. Gerçek adı için:
  # docker network ls | grep -i proxy   (veya npm compose dosyasındaki network adı)
  proxy:
    external: true
    name: ${NPM_NETWORK_NAME:-npm_default}

volumes:
  db_data:
  backend_uploads:
